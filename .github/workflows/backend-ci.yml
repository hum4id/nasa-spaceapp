name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend-nasa/**", "contracts/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend-nasa/**", "contracts/**", ".github/workflows/backend-ci.yml"]

# Least privilege: the token can only read the repo unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # only to upload the Bandit SARIF to code scanning
    defaults:
      run:
        working-directory: backend-nasa
    steps:
      # Third-party actions are pinned to full commit SHAs; the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev

      - run: mkdir -p evidence
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy app

      - name: Bandit static analysis (SARIF)
        run: uv run bandit -c pyproject.toml -r app -f sarif -o evidence/bandit.sarif
      - name: Upload Bandit SARIF to code scanning
        if: always() && hashFiles('backend-nasa/evidence/bandit.sarif') != ''
        # Private repos without GitHub Advanced Security cannot receive SARIF; the file is
        # still kept in the evidence artifact below.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: backend-nasa/evidence/bandit.sarif
          category: bandit

      - name: Export locked requirements
        run: uv export --frozen --no-emit-project --extra dev -o evidence/requirements.lock.txt
      - name: Dependency audit (pip-audit, from lockfile)
        run: >
          uv run pip-audit -r evidence/requirements.lock.txt --require-hashes --disable-pip
          --strict -f json -o evidence/pip-audit.json
      - name: SBOM (CycloneDX)
        run: uv run cyclonedx-py requirements evidence/requirements.lock.txt -o evidence/sbom.cdx.json

      - name: Tests and coverage
        run: uv run pytest --cov-report=xml:evidence/coverage.xml --junitxml=evidence/junit.xml

      - name: API contract is up to date
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code -- ../contracts/openapi.json

      - name: Upload security and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-evidence-${{ github.sha }}
          path: backend-nasa/evidence/
          if-no-files-found: warn
          retention-days: 30
