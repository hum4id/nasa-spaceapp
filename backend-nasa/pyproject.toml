[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldshift-backend"
version = "0.1.0"
description = "Field Shift: crop-rotation decision support API (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "limits>=3.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "anyio>=4.0",
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.10",
  "bandit[sarif]>=1.7.8",
  "pip-audit>=2.7",
  "cyclonedx-bom>=4.0",
]
# Optional stacks: each team installs what its module needs, e.g. pip install -e ".[dev,db]"
db = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
]
cache = ["redis>=5.0"]
worker = ["arq>=0.26"]
ml = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xarray>=2024.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: pure-function tests", "integration: API tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
